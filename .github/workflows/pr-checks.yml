# Reusable: pull-request hygiene.
#   - PR title must follow Conventional Commits (feat:, fix:, chore: ...) so release notes group nicely
#   - size/XS..XL label from the number of changed lines
#   - type label (feature, fix, ...) from the title, which release-drafter uses for its sections
#   - dependency review blocks PRs that add dependencies with known vulnerabilities (public repos)
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     pr:
#       uses: Wickedsoni/.github/.github/workflows/pr-checks.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
name: PR checks

on:
  workflow_call:
    inputs:
      dependency-review:
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false

  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const lines = pr.additions + pr.deletions;
            const size = lines < 10 ? "XS" : lines < 50 ? "S" : lines < 250 ? "M" : lines < 1000 ? "L" : "XL";
            const type = {
              feat: "feature", fix: "fix", perf: "performance", refactor: "refactor", docs: "documentation",
              test: "tests", build: "build", ci: "ci", chore: "chore", revert: "revert", style: "chore",
            }[(pr.title.match(/^(\w+)(\(.+\))?!?:/) || [])[1]];
            const breaking = /^\w+(\(.+\))?!:/.test(pr.title);
            const colors = { XS: "c2f0d1", S: "98f7b4", M: "f2c46d", L: "ffb4a6", XL: "ff6b6b" };

            const { owner, repo } = context.repo;
            const ensure = async (name, color) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color }); }
            };
            const want = [`size/${size}`];
            await ensure(want[0], colors[size]);
            if (type) { want.push(type); await ensure(type, "a6c8ff"); }
            if (breaking) { want.push("breaking"); await ensure("breaking", "b60205"); }

            const stale = pr.labels.map((l) => l.name).filter((n) => n.startsWith("size/") && !want.includes(n));
            for (const name of stale) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: want });

  dependencies:
    if: inputs.dependency-review && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
