# Reusable: build a release APK + AAB and publish them on a GitHub Release.
#
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     release:
#       uses: Wickedsoni/.github/.github/workflows/android-release.yml@main
#       permissions:
#         contents: write
#       secrets: inherit
#
# Signing (optional): add repo secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. They reach Gradle as environment variables of the same names, plus
# ANDROID_KEYSTORE_PATH. See this repo's README for the signingConfigs snippet. Without them the build is unsigned.
name: Android release

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      working-directory:
        type: string
        default: "."
      tasks:
        type: string
        default: "assembleRelease bundleRelease"
      prerelease:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the provided keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the release build is unsigned."
          fi

      - name: Gradle ${{ inputs.tasks }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ inputs.tasks }} --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          find . -path "*/build/outputs/*" \( -name "*.apk" -o -name "*.aab" -o -name "mapping.txt" \) -path "*release*" \
            -exec cp {} "$RUNNER_TEMP/dist/" \;
          ls -la "$RUNNER_TEMP/dist"

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/dist/*
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(github.ref_name, '-') }}
