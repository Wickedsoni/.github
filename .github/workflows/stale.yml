# Reusable: nudge, then close, issues and PRs with no activity. Anything labelled pinned, security or
# in-progress is left alone.
#
#   on:
#     schedule:
#       - cron: "30 1 * * 1"
#   jobs:
#     stale:
#       uses: Wickedsoni/.github/.github/workflows/stale.yml@main
#       permissions:
#         issues: write
#         pull-requests: write
name: Stale

on:
  workflow_call:
    inputs:
      days-before-stale:
        type: number
        default: 60
      days-before-close:
        type: number
        default: 14

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          exempt-issue-labels: pinned,security,in-progress
          exempt-pr-labels: pinned,security,in-progress
          stale-issue-message: "No activity for a while, so this is marked stale. Comment if it's still relevant and it stays open."
          stale-pr-message: "No activity for a while, so this PR is marked stale. Push or comment to keep it open."
