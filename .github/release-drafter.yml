# Shared release-drafter config. Repos opt in with a .github/release-drafter.yml containing `_extends: .github`.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels: [feature, enhancement]
  - title: "🐛 Fixes"
    labels: [fix, bug]
  - title: "⚡ Performance"
    labels: [performance]
  - title: "🧰 Maintenance"
    labels: [refactor, chore, build, ci, tests, dependencies]
  - title: "📝 Docs"
    labels: [documentation]
change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'
exclude-labels: [skip-changelog]
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  default: patch
autolabeler:
  - label: dependencies
    branch: ['/^dependabot\/.+/']
template: |
  $CHANGES

  **Full changelog:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
